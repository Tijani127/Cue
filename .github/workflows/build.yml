name: Build Cue

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Cancel superseded runs to avoid wasting Actions minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows/Linux native amd64 jobs also cross-compile the other
          # archs on the same runner to save minute-billed boot time.
          - os: windows
            runner: windows-2022
            native: amd64
            extra: [arm64, "386"]
          - os: linux
            runner: ubuntu-24.04
            native: amd64
            extra: [arm64, "386"]
          # macOS multiplier is 10x on free tier, so use one runner per
          # arch only (no cross-compiling to extra archs there).
          - os: darwin
            runner: macos-14 # Apple Silicon (arm64)
            native: arm64
            extra: []
          - os: darwin
            runner: macos-13 # Intel (x86_64)
            native: amd64
            extra: []
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Build native arch
        run: go build -o dist/cue-${{ matrix.os }}-${{ matrix.native }}${{ matrix.os == 'windows' && '.exe' || '' }} .

      - name: Cross-compile extra archs
        if: matrix.extra != ''
        shell: bash
        env:
          GOOS: ${{ matrix.os }}
        run: |
          for A in ${{ join(matrix.extra, ' ') }}; do
            GOARCH="$A" go build -o dist/cue-${{ matrix.os }}-"$A"${{ matrix.os == 'windows' && '.exe' || '' }} .
          done

      - name: Smoke test
        run: ./dist/cue-${{ matrix.os }}-${{ matrix.native }}${{ matrix.os == 'windows' && '.exe' || '' }} --version

      - uses: actions/upload-artifact@v4
        with:
          name: cue-${{ matrix.os }}
          path: dist/*